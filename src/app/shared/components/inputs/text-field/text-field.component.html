@if (fControlAsFC) {
  <section
    class="flex flex-col w-full gap-1.5"
    [class.dark]="theme() === 'dark'"
  >
    @if (props.label && props.labelLoc !== "hide") {
      <p
        class="text-xs text-foreground mb-1"
        [ngClass]="{
          '!text-destructive': fControlAsFC.errors && fControlAsFC.dirty,
        }"
      >
        {{ props.label }}
      </p>
    }

    <input
      appNumberInput
      [appNumberInputType]="$any(props)?.type || 'text'"
      [type]="inputType"
      [placeholder]="props.placeholder ?? ''"
      [formControl]="fControlAsFC"
      class="text-foreground text-xs placeholder:text-input py-2 px-3 transition-all duration-75 ease-[cubic-bezier(0.95,0.05,0.795,0.035)] rounded-xl w-full border outline-primary"
      [ngClass]="{
        'border-destructive hover:outline-destructive focus:outline-destructive':
          fControlAsFC.errors && fControlAsFC.dirty,
        'pointer-events-none bg-neutral-500/25': disabled,
        'hover:outline-2 hover:outline-offset-2 focus:outline-2 focus:outline-offset-2':
          !!props.disableHoverEffect,
      }"
    />

    <div
      class="flex items-center pb-1"
      [class.hidden]="!!props.disableHelperText"
    >
      <app-input-error
        [ngClass]="{ visible: showError, invisible: !showError }"
        [fControl]="fControlAsFC"
        [labelProps]="props.label"
      ></app-input-error>

      @if (showHint) {
        <small class="text-xs text-muted-foreground">{{ props.hint }}</small>
      }
    </div>
  </section>
}
